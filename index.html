<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una invitación especial para Fernanda 💖</title>
<meta name="description" content="Te invito a desayunar por tus 26 primaveras 🌸">
<meta property="og:title" content="Una invitación especial para ti 💖">
<meta property="og:description" content="Te invito a desayunar por tus 26 primaveras 🌸">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa-1:#fff0f6; --rosa-2:#ffd6e8; --rosa-3:#ff9ec7; --rosa-4:#f0609e; --rosa-5:#c2185b;
    --oro:#e8b96a; --oro-claro:#fbe3b4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh; overflow-x:hidden;
    font-family:'Quicksand',sans-serif; color:var(--rosa-5);
    background:
      radial-gradient(circle at 20% 15%, #ffe3f0 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #ffd0e6 0%, transparent 50%),
      linear-gradient(160deg,#fff5fa 0%,#ffe1ee 50%,#ffc8df 100%);
    display:flex; align-items:center; justify-content:center;
  }
  #cielo{position:fixed;inset:0;pointer-events:none;z-index:0}

  /* ---------- SOBRE ---------- */
  .escena{position:relative;z-index:2;width:min(92vw,420px);perspective:1200px}
  .sobre{
    position:relative; width:100%; aspect-ratio:4/3; cursor:pointer;
    transition:transform .9s cubic-bezier(.6,-0.3,.3,1.3), opacity .7s;
    filter:drop-shadow(0 25px 35px rgba(194,24,91,.28));
    animation:flotar 4s ease-in-out infinite;
  }
  @keyframes flotar{50%{transform:translateY(-10px)}}
  .sobre .cuerpo{position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(145deg,#ffb6d5,#ff8dbd);}
  .sobre .lado{position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(200deg,#ffc4de,#ff9fc8);
    clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
  .sobre .solapa{position:absolute;left:0;right:0;top:0;height:62%;
    background:linear-gradient(180deg,#ffd3e6,#ffa9cf);
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;
    transition:transform .8s ease;border-radius:14px 14px 0 0;z-index:3}
  .sello{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:4;
    width:78px;height:78px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#ff7fb2,#c2185b);
    box-shadow:0 0 0 4px rgba(255,255,255,.35),0 8px 18px rgba(120,0,50,.35);
    display:grid;place-items:center;transition:transform .5s, opacity .5s}
  .sello svg{width:44px;height:44px}
  .toca{position:absolute;left:0;right:0;bottom:-58px;text-align:center;
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.25rem;
    color:var(--rosa-4);animation:latido 1.6s ease-in-out infinite}
  @keyframes latido{50%{opacity:.45;transform:scale(.97)}}
  .para-quien{position:absolute;left:0;right:0;top:-88px;text-align:center;
    font-family:'Great Vibes',cursive;font-size:clamp(1.9rem,8vw,2.4rem);line-height:1.1;color:var(--rosa-5)}

  .abierto .solapa{transform:rotateX(180deg)}
  .abierto .sello{transform:translate(-50%,-50%) scale(0);opacity:0}
  .escena.fuera .sobre{transform:translateY(60px) scale(.85);opacity:0;pointer-events:none}
  .escena.fuera .toca,.escena.fuera .para-quien{opacity:0;transition:opacity .4s}

  /* ---------- TARJETA ---------- */
  .tarjeta{
    position:fixed; z-index:5; left:50%; top:50%;
    width:min(90vw,410px); max-height:92vh; overflow:auto;
    transform:translate(-50%,-30%) scale(.6); opacity:0; pointer-events:none;
    transition:transform 1s cubic-bezier(.2,1.2,.3,1), opacity .8s;
    padding:14px; border-radius:28px;
    background:linear-gradient(135deg,var(--oro-claro),var(--oro),#fff3dc,var(--oro));
    box-shadow:0 30px 60px rgba(194,24,91,.35);
  }
  .tarjeta.ver{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
  .interior{
    position:relative; border-radius:20px; padding:38px 26px 34px; text-align:center;
    background:
      radial-gradient(circle at 50% 0%,#fff 0%,transparent 60%),
      linear-gradient(180deg,#fff7fb 0%,#ffe6f1 100%);
    overflow:hidden;
  }
  .interior::before{content:"";position:absolute;inset:10px;border-radius:14px;
    border:1.5px dashed rgba(240,96,158,.45);pointer-events:none}
  .corona{width:92px;margin:0 auto 6px;display:block;
    filter:drop-shadow(0 4px 6px rgba(232,185,106,.6));animation:brillo 3s ease-in-out infinite}
  @keyframes brillo{50%{filter:drop-shadow(0 0 14px rgba(255,215,140,.95))}}
  .hola{font-family:'Great Vibes',cursive;font-size:2.5rem;color:var(--rosa-4);line-height:1.1}
  .linea1{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:#8a1745;margin-top:10px;letter-spacing:.5px}
  .desayuno{font-family:'Great Vibes',cursive;font-size:3.4rem;line-height:1;margin:4px 0 8px;
    background:linear-gradient(90deg,#c2185b,#ff5fa2,#c2185b);-webkit-background-clip:text;background-clip:text;color:transparent;
    background-size:200% auto;animation:shimmer 4s linear infinite}
  @keyframes shimmer{to{background-position:200% center}}
  .por{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;color:#8a1745}
  .numero{
    font-family:'Cormorant Garamond',serif;font-weight:600;font-size:6.2rem;line-height:1;margin:2px 0 -6px;
    background:linear-gradient(180deg,#fbe3b4 0%,#e8b96a 45%,#b8843a 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 2px rgba(194,24,91,.25))}
  .primaveras{font-family:'Great Vibes',cursive;font-size:2.7rem;color:var(--rosa-4)}
  .flores{font-size:1.5rem;letter-spacing:8px;margin:10px 0 4px}
  .tazita{font-size:2.2rem;margin:6px 0 2px}
  .msg{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;color:#9b2a59;line-height:1.45;margin:8px auto 0;max-width:300px}
  .btn{
    margin-top:22px;border:0;cursor:pointer;font-family:'Quicksand',sans-serif;font-weight:600;font-size:1.05rem;
    color:#fff;padding:14px 30px;border-radius:999px;
    background:linear-gradient(135deg,#ff7fb2,#e0407f);
    box-shadow:0 10px 22px rgba(224,64,127,.4), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .2s, box-shadow .2s}
  .btn:active{transform:scale(.95)}
  .respuesta{margin-top:16px;font-family:'Great Vibes',cursive;font-size:2rem;color:var(--rosa-4);
    opacity:0;transform:translateY(8px);transition:all .6s}
  .respuesta.ver{opacity:1;transform:none}
  .firma{margin-top:18px;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;color:var(--rosa-3)}
  .estrella{position:absolute;color:var(--oro);animation:titilar 2.4s ease-in-out infinite;pointer-events:none}
  @keyframes titilar{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}

  /* ---------- MÚSICA ---------- */
  .musica{position:fixed;right:16px;bottom:16px;z-index:9;width:46px;height:46px;border-radius:50%;border:0;
    background:rgba(255,255,255,.75);backdrop-filter:blur(6px);box-shadow:0 6px 16px rgba(194,24,91,.25);
    font-size:1.3rem;cursor:pointer;display:none}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="cielo"></canvas>

<div class="escena" id="escena">
  <div class="para-quien" id="paraQuien">Para el amor de mi vida</div>
  <div class="sobre" id="sobre" role="button" aria-label="Abrir invitación" tabindex="0">
    <div class="cuerpo"></div>
    <div class="lado"></div>
    <div class="solapa"></div>
    <div class="sello">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.3 1.1 4 2.3h3.2C14.3 6.1 15.6 5 17.6 5 21 5 23.1 8.4 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
    </div>
  </div>
  <div class="toca">✨ Toca para abrir ✨</div>
</div>

<div class="tarjeta" id="tarjeta" aria-live="polite">
  <div class="interior" id="interior">
    <svg class="corona" viewBox="0 0 120 80" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff1cf"/><stop offset=".5" stop-color="#e8b96a"/><stop offset="1" stop-color="#b8843a"/>
        </linearGradient>
      </defs>
      <path d="M10 68 L6 22 L34 44 L60 8 L86 44 L114 22 L110 68 Z" fill="url(#g)" stroke="#b8843a" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="10" y="64" width="100" height="10" rx="3" fill="url(#g)" stroke="#b8843a" stroke-width="1.5"/>
      <circle cx="60" cy="8" r="6" fill="#ff5fa2"/><circle cx="6" cy="22" r="5" fill="#ff9ec7"/><circle cx="114" cy="22" r="5" fill="#ff9ec7"/>
      <circle cx="35" cy="56" r="4.5" fill="#ff5fa2"/><circle cx="60" cy="54" r="6" fill="#f0609e"/><circle cx="85" cy="56" r="4.5" fill="#ff5fa2"/>
    </svg>

    <div class="hola" id="hola">Hola, Fernanda</div>
    <div class="linea1">Te invito a</div>
    <div class="desayuno">desayunar</div>
    <div class="por">por tus</div>
    <div class="numero">26</div>
    <div class="primaveras">primaveras</div>
    <div class="flores">🌸🌷🌸</div>
    <div class="tazita">☕🥐🍓</div>
    <p class="msg">Porque eres el amor de mi vida y mereces empezar tu nuevo año como la princesa que eres: consentida, feliz y a mi lado.</p>

    <button class="btn" id="acepto">Sí, acepto, ¡claro que acepto! 💖</button>
    <div class="respuesta" id="respuesta">Te amo, princesa 👑</div>
    <div class="firma">Con todo mi amor</div>
  </div>
</div>

<script>
(function(){
  // ---- Personalización por link: ?para=Nombre ----
  const qs = new URLSearchParams(location.search);
  const nombre = (qs.get('para') || '').trim().slice(0,30);
  if(nombre){
    const limpio = nombre.replace(/[<>]/g,'');
    document.getElementById('paraQuien').textContent = 'Para ' + limpio;
    document.getElementById('hola').textContent = 'Hola, ' + limpio;
    document.title = 'Una invitación especial para ' + limpio + ' 💖';
  }

  // ---- Partículas: pétalos, corazones y brillitos ----
  const cv = document.getElementById('cielo'), ctx = cv.getContext('2d');
  let W,H,dpr; const P=[];
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  size(); addEventListener('resize',size);
  const colores=['#ff9ec7','#ffb6d5','#f0609e','#ffd6e8','#ff7fb2'];
  function nueva(top){
    const t=Math.random();
    return {x:Math.random()*W,y:top?-20:Math.random()*H,s:6+Math.random()*10,
      vy:.4+Math.random()*.9,vx:-.3+Math.random()*.6,r:Math.random()*6.28,vr:-.02+Math.random()*.04,
      tipo:t<.5?'petalo':t<.78?'corazon':'brillo',c:colores[Math.random()*colores.length|0],f:Math.random()*6.28}
  }
  const N = innerWidth<600?38:60; for(let i=0;i<N;i++)P.push(nueva(false));
  function corazon(s){ctx.beginPath();ctx.moveTo(0,s*.3);ctx.bezierCurveTo(-s,-s*.4,-s*.4,-s,0,-s*.35);ctx.bezierCurveTo(s*.4,-s,s,-s*.4,0,s*.3);ctx.fill()}
  function petalo(s){ctx.beginPath();ctx.ellipse(0,0,s*.45,s*.8,0,0,6.28);ctx.fill()}
  function brillo(s,f){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(f));ctx.fillStyle='#f5cf86';ctx.beginPath();
    for(let i=0;i<4;i++){const a=i*Math.PI/2;ctx.lineTo(Math.cos(a)*s*.7,Math.sin(a)*s*.7);ctx.lineTo(Math.cos(a+.785)*s*.18,Math.sin(a+.785)*s*.18)}ctx.fill();ctx.globalAlpha=1}
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      p.y+=p.vy;p.x+=p.vx+Math.sin(p.f)*.4;p.r+=p.vr;p.f+=.02;
      if(p.y>H+20||p.x<-30||p.x>W+30)Object.assign(p,nueva(true));
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=.85;
      if(p.tipo==='petalo')petalo(p.s);else if(p.tipo==='corazon')corazon(p.s);else brillo(p.s,p.f);
      ctx.restore();
    }
    for(let i=C.length-1;i>=0;i--){const c=C[i];c.vy+=.12;c.x+=c.vx;c.y+=c.vy;c.r+=c.vr;c.v--;
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.globalAlpha=Math.min(1,c.v/40);
      if(c.h)corazon(c.s);else ctx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);ctx.restore();if(c.v<=0)C.splice(i,1)}
    requestAnimationFrame(loop);
  }
  const C=[];
  function confeti(x,y,n){const pal=['#ff5fa2','#ffd6e8','#e8b96a','#fff','#f0609e','#ffb6d5'];
    for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*7;
      C.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:Math.random()*6,vr:-.2+Math.random()*.4,s:6+Math.random()*8,
        c:pal[Math.random()*pal.length|0],v:110+Math.random()*60,h:Math.random()<.35})}}
  loop();

  // ---- Estrellitas dentro de la tarjeta ----
  const int=document.getElementById('interior');
  for(let i=0;i<14;i++){const e=document.createElement('span');e.className='estrella';e.textContent='✦';
    e.style.left=(4+Math.random()*92)+'%';e.style.top=(3+Math.random()*94)+'%';
    e.style.fontSize=(8+Math.random()*10)+'px';e.style.animationDelay=(Math.random()*2.4)+'s';int.appendChild(e)}

  // ---- Melodía suave (campanitas) con Web Audio, sin archivos ----
  let audio=null, sonando=false, timer=null;
  const notas=[659.25,783.99,880,987.77,880,783.99,659.25,587.33,659.25,783.99,659.25,523.25];
  function campana(f,t){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);
    o.connect(g).connect(audio.destination);o.start(t);o.stop(t+1.5)}
  function tocar(){let i=0;const paso=()=>{if(!sonando)return;campana(notas[i%notas.length],audio.currentTime);
    if(i%4===0)campana(notas[i%notas.length]/2,audio.currentTime);i++;timer=setTimeout(paso,420)};paso()}
  const bm=document.createElement('button');bm.className='musica';bm.setAttribute('aria-label','Música');bm.textContent='🎵';document.body.appendChild(bm);
  bm.onclick=()=>{sonando=!sonando;bm.textContent=sonando?'🎵':'🔇';if(sonando)tocar();else clearTimeout(timer)};

  // ---- Abrir sobre ----
  const sobre=document.getElementById('sobre'),escena=document.getElementById('escena'),tarjeta=document.getElementById('tarjeta');
  let abierto=false;
  function abrir(){
    if(abierto)return;abierto=true;
    try{audio=new (window.AudioContext||window.webkitAudioContext)();sonando=true;tocar();bm.style.display='block'}catch(e){}
    sobre.classList.add('abierto');
    const r=sobre.getBoundingClientRect();
    setTimeout(()=>{confeti(r.left+r.width/2,r.top+r.height/2,120);escena.classList.add('fuera')},700);
    setTimeout(()=>tarjeta.classList.add('ver'),1100);
  }
  sobre.addEventListener('click',abrir);
  sobre.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')abrir()});

  // ---- Aceptar ----
  document.getElementById('acepto').addEventListener('click',e=>{
    const r=e.currentTarget.getBoundingClientRect();
    confeti(r.left+r.width/2,r.top,160);setTimeout(()=>confeti(W*.2,H*.3,70),250);setTimeout(()=>confeti(W*.8,H*.3,70),450);
    document.getElementById('respuesta').classList.add('ver');
    e.currentTarget.textContent='¡Sabía que dirías que sí! 💕';
    if(navigator.vibrate)navigator.vibrate([60,40,60]);
  });
})();
</script>
</body>
</html>
