<style>
  :root { --red: #BE3455; --red-hi: #ff4f7b; --bg: #07090f; --panel: rgba(13, 17, 28, .78); --line: rgba(255,255,255,.08);
          --txt: #f1f5f9; --muted: #8b95a7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  /* ---------- Marca ---------- */
  .logo { font-family: Montserrat, "Arial Black", sans-serif; font-weight: 900; letter-spacing: -.02em; line-height: 1; white-space: nowrap; }
  .logo .es { color: var(--red); }

  /* ---------- Intro ---------- */
  #intro { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background:
      radial-gradient(60% 50% at 50% 45%, rgba(190,52,85,.22), transparent 70%), var(--bg);
    transition: opacity .7s ease, visibility .7s; }
  #intro.out { opacity: 0; visibility: hidden; }
  .intro-box { text-align: center; }
  .intro-logo { font-size: clamp(2.6rem, 11vw, 5.2rem); display: inline-flex; overflow: hidden; }
  .intro-logo span { display: inline-block; transform: translateY(110%); animation: up .7s cubic-bezier(.2,.9,.2,1.15) forwards; }
  .intro-logo .es { text-shadow: 0 0 28px rgba(255,79,123,.65); }
  @keyframes up { to { transform: none; } }
  .intro-sub { margin-top: .9rem; font-size: .78rem; font-weight: 800; letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
    opacity: 0; animation: fade .6s .9s forwards; }
  .intro-bar { width: 180px; height: 3px; margin: 1.4rem auto 0; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden;
    opacity: 0; animation: fade .4s 1s forwards; }
  .intro-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--red-hi), transparent);
    animation: load 1.1s ease-in-out infinite; }
  @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  @keyframes fade { to { opacity: 1; } }

  /* ---------- Estructura ---------- */
  .app { position: fixed; inset: 0; }
  #map { position: absolute; inset: 0; background: #0d1220; }
  .leaflet-container { background: #0d1220; font-family: inherit; }
  .dark-tiles { filter: invert(100%) hue-rotate(185deg) brightness(88%) contrast(88%) saturate(55%); }

  /* Viñeta y barrido de radar encima del mapa (no bloquean el toque) */
  .fx { position: absolute; inset: 0; z-index: 400; pointer-events: none; }
  .vignette { background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(7,9,15,.85) 100%); }
  .radar { overflow: hidden; }
  .radar::before { content: ""; position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax;
    background: conic-gradient(from 0deg, rgba(255,79,123,0) 0deg, rgba(255,79,123,0) 300deg, rgba(255,79,123,.14) 352deg, rgba(255,79,123,.28) 360deg);
    animation: spin 6s linear infinite; mix-blend-mode: screen; }
  .radar::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 48px 48px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Encabezado ---------- */
  header { position: absolute; z-index: 1000; top: calc(.7rem + env(safe-area-inset-top)); left: .7rem; right: .7rem;
    display: flex; align-items: center; gap: .9rem; padding: .7rem .9rem; border-radius: 18px;
    background: var(--panel); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--line); box-shadow: 0 18px 40px -18px rgba(0,0,0,.8);
    transform: translateY(-140%); transition: transform .8s cubic-bezier(.2,.9,.2,1.1); }
  .ready header { transform: none; }
  header .logo { font-size: 1.25rem; padding-right: .9rem; border-right: 1px solid var(--line); }
  .head-txt { min-width: 0; flex: 1; }
  .city { margin: 0; font-size: .66rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h1 { margin: .15rem 0 0; font-size: clamp(.95rem, 3vw, 1.25rem); line-height: 1.2; font-weight: 800;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: .45rem; padding: .38rem .7rem; border-radius: 999px; font-size: .68rem; font-weight: 900;
    letter-spacing: .1em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--red), #8f1f3c);
    animation: glow 2s infinite; white-space: nowrap; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1s infinite; }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(255,79,123,.55); } 70% { box-shadow: 0 0 0 12px rgba(255,79,123,0); } 100% { box-shadow: 0 0 0 0 rgba(255,79,123,0); } }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---------- Leyenda ---------- */
  footer { position: absolute; z-index: 1000; left: .7rem; right: .7rem; bottom: calc(.7rem + env(safe-area-inset-bottom));
    padding: .75rem .8rem .6rem; border-radius: 18px; background: var(--panel);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--line); box-shadow: 0 -10px 40px -18px rgba(0,0,0,.8);
    transform: translateY(150%); transition: transform .8s .15s cubic-bezier(.2,.9,.2,1.1); }
  .ready footer { transform: none; }
  #legend { display: flex; flex-wrap: wrap; gap: .5rem; }
  .cand { --c: var(--red); display: inline-flex; align-items: center; gap: .55rem; padding: .3rem .85rem .3rem .3rem; border-radius: 999px;
    border: 1.5px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: inherit; font: inherit; font-weight: 800; font-size: .9rem;
    cursor: pointer; transition: transform .2s, opacity .25s, background .25s, border-color .25s, box-shadow .25s, filter .25s;
    opacity: 0; animation: pop .5s cubic-bezier(.2,.9,.2,1.3) forwards; }
  .cand:hover { transform: translateY(-2px); }
  .cand img, .cand .sw { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 3px solid var(--c); background: var(--c);
    box-shadow: 0 0 14px -2px var(--c); }
  .cand.on { border-color: var(--c); background: rgba(255,255,255,.1); box-shadow: 0 0 22px -6px var(--c); }
  .cand.off { opacity: .32 !important; filter: grayscale(.7); }
  .cand.all { --c: #fff; border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.12); animation: pop .35s cubic-bezier(.2,.9,.2,1.3) forwards; }
  .cand .sw.x { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.15);
    border: 3px solid rgba(255,255,255,.6); box-shadow: none; font-size: .9rem; font-weight: 900; color: #fff; }
  @keyframes pop { from { opacity: 0; transform: scale(.7) translateY(8px); } to { opacity: 1; transform: none; } }
  .foot-row { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-top: .55rem; color: var(--muted); font-size: .7rem; font-weight: 600; }
  .foot-row .logo { font-size: .78rem; color: #cbd5e1; }
  .muted { color: var(--muted); font-weight: 600; }

  /* ---------- Puntos ---------- */
  .dot { transform-box: fill-box; transform-origin: center; }
  /* Sobre las capas del INE los puntos de votos llevan borde blanco para distinguirlos del color de la sección. */
  .ine-mode .dot { stroke: #fff; stroke-width: 1.6px; stroke-opacity: .95; }
  .dot.intro { animation: drop .6s cubic-bezier(.2,.9,.25,1.4) both; }
  @keyframes drop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  .pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--c); animation: ring 1.1s ease-out 3; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 var(--c); } 100% { box-shadow: 0 0 0 30px transparent; } }
  .toast { position: absolute; z-index: 1100; left: 50%; top: calc(8.6rem + env(safe-area-inset-top)); transform: translate(-50%, -20px); opacity: 0;
    padding: .5rem 1rem; border-radius: 999px; background: rgba(13,17,28,.92); border: 1px solid var(--line); font-size: .8rem; font-weight: 800;
    display: inline-flex; align-items: center; gap: .5rem; transition: opacity .35s, transform .35s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }

  /* Controles de Leaflet con el estilo de la marca */
  .leaflet-top { top: calc(8.4rem + env(safe-area-inset-top)); }

  /* ---------- Capas del INE ---------- */
  .modes { position: absolute; z-index: 1000; left: .7rem; right: .7rem; top: calc(5.5rem + env(safe-area-inset-top));
    display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; padding: .1rem 0 .3rem;
    opacity: 0; transform: translateY(-10px); transition: opacity .6s .3s, transform .6s .3s; }
  .modes::-webkit-scrollbar { display: none; }
  .ready .modes { opacity: 1; transform: none; }
  .mode { flex: none; display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .8rem; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #cbd5e1; font: inherit; font-size: .78rem; font-weight: 800; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
  .mode.on { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 18px -4px rgba(255,79,123,.7); }
  .mode .tag { font-size: .6rem; padding: .1rem .35rem; border-radius: 6px; background: rgba(255,255,255,.12); letter-spacing: .05em; }
  .scale { display: none; align-items: center; gap: .5rem; margin-bottom: .6rem; font-size: .72rem; font-weight: 700; color: var(--muted); }
  .scale.show { display: flex; }
  .scale .bar { flex: 1; height: 8px; border-radius: 6px; }
  .scale b { color: var(--txt); font-weight: 800; white-space: nowrap; }
  .mode .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--k); box-shadow: 0 0 8px var(--k); }
  .mode.on .sw { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }
  .src { font-size: .62rem; color: #64748b; margin-top: .35rem; }
  .sec-pop .leaflet-popup-content-wrapper { background: rgba(13,17,28,.96); color: var(--txt); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 20px 40px -12px rgba(0,0,0,.9); }
  .sec-pop .leaflet-popup-tip { background: rgba(13,17,28,.96); }
  .sec-pop .leaflet-popup-content { margin: .9rem 1rem; min-width: 210px; font-family: inherit; }
  .sec-pop a.leaflet-popup-close-button { color: #94a3b8; }
  .sp-k { font-size: .62rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .sp-n { font-family: Montserrat, sans-serif; font-weight: 900; font-size: 1.35rem; margin: .1rem 0 .55rem; }
  .sp-n small { font-family: "Plus Jakarta Sans", sans-serif; font-size: .72rem; color: var(--muted); font-weight: 700; margin-left: .3rem; }
  .sp-row { display: flex; justify-content: space-between; font-size: .78rem; font-weight: 700; margin: .3rem 0 .15rem; }
  .sp-track { height: 6px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; display: flex; }
  .sp-track i { display: block; height: 100%; }
  .leaflet-tooltip.sec-lbl { background: rgba(7,9,15,.78); border: 1px solid rgba(255,255,255,.18); color: #fff; box-shadow: none;
    padding: 1px 6px; border-radius: 8px; font: 800 11px/1.3 "Plus Jakarta Sans", sans-serif; }
  .leaflet-tooltip.sec-lbl::before { display: none; }
  .sp-lead { display: flex; align-items: center; gap: .45rem; margin-top: .7rem; padding-top: .6rem; border-top: 1px solid var(--line); font-size: .78rem; font-weight: 800; }
  .sp-lead i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .leaflet-bar, .leaflet-control-layers { border: 1px solid var(--line) !important; border-radius: 12px !important; overflow: hidden;
    background: var(--panel) !important; backdrop-filter: blur(10px); box-shadow: 0 10px 24px -12px rgba(0,0,0,.8) !important; }
  .leaflet-bar a { background: transparent !important; color: #e2e8f0 !important; border-bottom-color: var(--line) !important; }
  .leaflet-bar a:hover { background: var(--red) !important; color: #fff !important; }
  .leaflet-control-layers-expanded { color: #e2e8f0; }
  .leaflet-control-attribution { background: rgba(7,9,15,.6) !important; color: #64748b !important; font-size: 9px; }
  .leaflet-control-attribution a { color: #94a3b8 !important; }
  .leaflet-bottom { bottom: 11rem; }

  @media (min-width: 900px) {
    footer { right: auto; max-width: 520px; }
    .leaflet-bottom { bottom: .5rem; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* ===== Ajustes ===== */
const FIREBASE = {
  apiKey: "AIzaSyCTKcMeBVPK6WHqMQbEFjqt2ErvPPbAPBA",
  authDomain: "muestramx-61d39.firebaseapp.com",
  projectId: "muestramx-61d39",
  appId: "1:225645214792:web:025d60e43e41c8da6a2c7d",
};
// Ciudad de esta página (la pone build.js; ver CIUDADES ahí). ?e=ID fuerza otra encuesta.
const CITY = window.__CITY || { name: "Playa del Carmen", survey: "playa-del-carmen-2027", lat: 20.6296, lng: -87.0739, zoom: 13 };
const HALF_CELL = 0.0025;                                  // los puntos se reparten en su zona (~500 m)
const SITE = "https://muestra.mx";                         // para fotos guardadas con ruta relativa
const INTRO_MS = 1900;                                     // duración mínima de la intro
/* =================== */

const PARTY = { MORENA:"#9F2241", PVEM:"#2E9E44", VERDE:"#2E9E44", PT:"#D52B1E", PAN:"#0059A8", PRI:"#00843D",
  PRD:"#E5B800", MC:"#FF7A00", "MOVIMIENTO CIUDADANO":"#FF7A00", INDEPENDIENTE:"#6B7280" };
const PALETTE = ["#E63946","#1D8FE1","#F4A259","#06A77D","#9B5DE5","#F15BB5","#00BBF9","#FEE440"];
const partyColor = (p) => {
  const k = String(p || "").trim().toUpperCase();
  if (!k) return null;
  if (PARTY[k]) return PARTY[k];
  const first = k.split(/[\s\-/,+]+/).find((x) => PARTY[x]);
  return first ? PARTY[first] : null;
};
const txt = (v) => (v && typeof v === "object" ? v.es || v.en || "" : String(v || ""));
const esc = (t) => String(t).replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" })[c]);
// Número pseudoaleatorio estable: los puntos no "brincan" cuando entran votos nuevos.
const seeded = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return ((h >>> 0) % 10000) / 10000; };

/* ---------- Mapa ---------- */
const map = L.map("map", { maxZoom: 18, minZoom: 3 }).setView([CITY.lat, CITY.lng], CITY.zoom);
// "Oscuro" = el mapa de calles de Esri (detalle y nombres de calles hasta zoom 18) invertido con CSS.
const esri = (s, opts = {}) => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`,
  { attribution: "Tiles &copy; Esri", maxZoom: 18, maxNativeZoom: 18, ...opts });
const bases = { Oscuro: esri("World_Street_Map", { className: "dark-tiles" }), Calles: esri("World_Street_Map"), "Satélite": esri("World_Imagery") };
bases.Oscuro.addTo(map);
L.control.layers(bases, undefined, { position: "topright" }).addTo(map);
const svg = L.svg({ padding: 0.5 });
map.createPane("secciones").style.zIndex = 350;
const secRenderer = L.svg({ pane: "secciones", padding: 0.5 });
let secLayer = null;
let mode = "votos";
const zonesLayer = L.layerGroup().addTo(map);
const dots = L.layerGroup().addTo(map);
const legendEl = document.getElementById("legend");
const db = getFirestore(initializeApp(FIREBASE));

/* ---------- Dibujo ---------- */
let framed = false;
let firstPaint = false;          // la primera vez que se ve el mapa, los puntos "caen" uno tras otro
let introDone = false;
let colors = {};
let celdas = {};
let prev = null;                 // conteos anteriores, para saber qué puntos son nuevos
const selected = new Set();      // candidatos elegidos en la leyenda (vacío = todos)
const visible = (opt) => !selected.size || selected.has(opt);

/* ---------- Intro ---------- */
const started = performance.now();
let introQueued = false;
function endIntro() {
  if (introQueued) return;
  introQueued = true;
  const wait = Math.max(0, INTRO_MS - (performance.now() - started));
  setTimeout(() => {
    introDone = true;
    document.getElementById("intro").classList.add("out");
    document.body.classList.add("ready");
    map.invalidateSize();
    firstPaint = true;
    draw(false);
  }, wait);
}
setTimeout(endIntro, 6000); // por si la red tarda

function renderLegend(present) {
  const items = Object.entries(colors);
  if (!items.length) { legendEl.innerHTML = `<span class="muted">Aún no hay votos con ubicación.</span>`; return; }
  const animate = !legendEl.dataset.done;
  legendEl.innerHTML = items.map(([id, v], i) => {
    const cls = selected.size ? (selected.has(id) ? "on" : "off") : "";
    const pic = v.img ? `<img src="${esc(v.img)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'sw'}))">` : `<span class="sw"></span>`;
    const delay = animate ? `animation-delay:${0.45 + i * 0.12}s;` : "animation:none;opacity:1;";
    return `<button class="cand ${cls}" style="--c:${v.color};${delay}" data-id="${esc(id)}">${pic}${esc(v.label)}</button>`;
  }).join("") + (selected.size ? `<button class="cand all" id="ver-todos"><span class="sw x">✕</span>Ver todos</button>` : "");
  legendEl.dataset.done = "1";
  const all = document.getElementById("ver-todos");
  if (all) all.onclick = () => { selected.clear(); draw(false); };
  legendEl.querySelectorAll(".cand[data-id]").forEach((b) => b.onclick = () => {
    const id = b.dataset.id;
    if (selected.has(id)) selected.delete(id); else { selected.clear(); selected.add(id); }
    draw(false);
  });
}

function pulse(p, color) {
  const m = L.marker(p, { interactive: false, icon: L.divIcon({ className: "", iconSize: [14, 14],
    html: `<div class="pulse" style="--c:${color}"></div>` }) }).addTo(map);
  setTimeout(() => m.remove(), 3500);
}

let toastTimer;
function toast(label, color) {
  const el = document.getElementById("toast");
  el.style.setProperty("--c", color);
  el.querySelector("span").textContent = `Nuevo voto · ${label}`;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function draw(fromServer) {
  if (!introDone) return;
  dots.clearLayers();
  zonesLayer.clearLayers();
  const present = new Set();
  const pts = [];
  const pending = [];
  let fresh = null;
  for (const [key, counts] of Object.entries(celdas || {})) {
    const [i, j] = key.split("_").map(Number);
    if (!Number.isFinite(i) || !Number.isFinite(j)) continue;
    const clat = (i + 0.5) * 2 * HALF_CELL, clng = (j + 0.5) * 2 * HALF_CELL;

    // Zona pintada del color de quien va ganando ahí (empate = sin color).
    const ranked = Object.entries(counts || {}).map(([o, n]) => [o, Number(n) || 0]).filter(([o, n]) => n > 0 && visible(o))
      .sort((a, b) => b[1] - a[1]);
    if (ranked.length && (ranked.length === 1 || ranked[0][1] > ranked[1][1])) {
      const c = colors[ranked[0][0]]?.color || "#BE3455";
      L.rectangle([[clat - HALF_CELL, clng - HALF_CELL], [clat + HALF_CELL, clng + HALF_CELL]],
        { renderer: svg, stroke: true, color: c, weight: 1, opacity: .45, fillColor: c, fillOpacity: .2, interactive: false })
        .addTo(zonesLayer);
    }

    for (const [opt, nRaw] of Object.entries(counts || {})) {
      const n = Number(nRaw) || 0;
      if (!n) continue;
      present.add(opt);
      if (!visible(opt)) continue;
      const color = colors[opt]?.color || "#BE3455";
      const before = prev ? Number(prev[key]?.[opt]) || 0 : n;
      for (let k = 0; k < n; k++) {
        const s = `${key}|${opt}|${k}`;
        const p = [clat + (seeded(s + "a") * 2 - 1) * HALF_CELL, clng + (seeded(s + "b") * 2 - 1) * HALF_CELL];
        pts.push(p);
        pending.push([p, color, seeded(s + "d")]);
        if (fromServer && k >= before) { pulse(p, color); fresh = [colors[opt]?.label || "", color]; }
      }
    }
  }
  pending.forEach(([p, color, r]) => {
    const m = L.circleMarker(p, { renderer: svg, className: "dot" + (firstPaint ? " intro" : ""), radius: 5.5,
      color: "rgba(7,9,15,.9)", weight: 1.2, fillColor: color, fillOpacity: .95, interactive: false }).addTo(dots);
    if (firstPaint && m._path) m._path.style.animationDelay = `${0.2 + r * 1.4}s`;
  });
  firstPaint = false;
  if (MODES[mode]) zonesLayer.eachLayer((l) => l.setStyle({ fillOpacity: 0, opacity: 0 }));
  if (fromServer) prev = JSON.parse(JSON.stringify(celdas || {}));
  if (fresh) toast(...fresh);
  renderLegend(present);
  if (!framed && pts.length) {
    framed = true;
    const near = pts.filter(([a, b]) => Math.abs(a - CITY.lat) < 0.12 && Math.abs(b - CITY.lng) < 0.12);
    map.flyToBounds(L.latLngBounds(near.length ? near : pts), { padding: [70, 70], maxZoom: 15, duration: 1.4 });
  }
}


/* ---------- Secciones electorales del INE ---------- */
// Cada capa con su propio color, para que se distinga qué se está viendo.
const MODES = {
  ln:  { label: "Electores por sección", val: (p) => p.ln, fmt: (v) => v.toLocaleString("es-MX"),
         ramp: ["#0b1f3a", "#123f6b", "#1c6aa0", "#2fa0d0", "#7fdcff"] },
  jov: { label: "% de jóvenes (18-29)", val: (p) => p.ln ? p.e1 / p.ln : 0, fmt: (v) => Math.round(v * 100) + "%",
         ramp: ["#0f2a1c", "#145a3a", "#1d8a55", "#3cc47a", "#9af5b8"] },
  muj: { label: "% de mujeres", val: (p) => p.ln ? p.m / p.ln : 0, fmt: (v) => Math.round(v * 100) + "%",
         ramp: ["#2a1036", "#4f1d6b", "#7c2fa3", "#b05be0", "#e7a8ff"] },
  hom: { label: "% de hombres", val: (p) => p.ln ? p.h / p.ln : 0, fmt: (v) => Math.round(v * 100) + "%",
         ramp: ["#062a2a", "#0b4f4f", "#127a78", "#1fb3ad", "#6ff0e6"] },
  adu: { label: "% de adultos (30-64)", val: (p) => p.ln ? (p.e2 + p.e3) / p.ln : 0, fmt: (v) => Math.round(v * 100) + "%",
         ramp: ["#2b2a06", "#57530b", "#8a8413", "#c9c021", "#fff36b"] },
  may: { label: "% de mayores de 65", val: (p) => p.ln ? p.e4 / p.ln : 0, fmt: (v) => Math.round(v * 100) + "%",
         ramp: ["#2e1a05", "#5c3507", "#9a5a0a", "#d98c16", "#ffd06b"] },
};
let RAMP = MODES.ln.ramp;
let breaks = [];
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function quantiles(values) {
  const v = values.filter((x) => x > 0).sort((a, b) => a - b);
  if (!v.length) return [0, 0, 0, 0, 0, 0];
  return [0, .2, .4, .6, .8, 1].map((q) => v[Math.min(v.length - 1, Math.floor(q * (v.length - 1)))]);
}
function rampColor(x) {
  for (let i = 1; i < breaks.length; i++) if (x <= breaks[i]) return RAMP[Math.min(RAMP.length - 1, i - 1)];
  return RAMP[RAMP.length - 1];
}

function sectionStyle(f) {
  if (mode === "votos") return { color: "rgba(255,255,255,.28)", weight: 0.8, fill: true, fillOpacity: 0, fillColor: "#000" };
  return { color: "rgba(7,9,15,.55)", weight: 0.7, fill: true, fillOpacity: .62, fillColor: rampColor(MODES[mode].val(f.properties)) };
}

// Candidato que va adelante (en la encuesta) dentro de una sección: se cuentan las zonas cuyo centro cae dentro.
function inRing(pt, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function inGeom(pt, g) {
  const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  return polys.some((poly) => inRing(pt, poly[0]) && !poly.slice(1).some((h) => inRing(pt, h)));
}
function leaderIn(geometry) {
  const tally = {};
  for (const [key, counts] of Object.entries(celdas || {})) {
    const [i, j] = key.split("_").map(Number);
    const c = [(j + 0.5) * 2 * HALF_CELL, (i + 0.5) * 2 * HALF_CELL];
    if (!inGeom(c, geometry)) continue;
    for (const [o, n] of Object.entries(counts || {})) tally[o] = (tally[o] || 0) + (Number(n) || 0);
  }
  const r = Object.entries(tally).sort((a, b) => b[1] - a[1]);
  if (!r.length || (r[1] && r[1][1] === r[0][1])) return null;
  return colors[r[0][0]] || null;
}

function popupHtml(f) {
  const p = f.properties;
  const ages = [["18-29", p.e1, "#ff4f7b"], ["30-44", p.e2, "#BE3455"], ["45-64", p.e3, "#8f1f3c"], ["65+", p.e4, "#5a1a33"]];
  const lead = leaderIn(f.geometry);
  return `<div class="sp-k">Sección electoral · Distrito local ${p.dl}</div>
    <div class="sp-n">${p.s}<small>${p.ln.toLocaleString("es-MX")} electores</small></div>
    <div class="sp-row"><span>Mujeres ${pct(p.m, p.ln)}%</span><span>Hombres ${pct(p.h, p.ln)}%</span></div>
    <div class="sp-track"><i style="width:${pct(p.m, p.ln)}%;background:#ff4f7b"></i><i style="width:${pct(p.h, p.ln)}%;background:#1D8FE1"></i></div>
    ${ages.map(([k, v, c]) => `<div class="sp-row"><span>${k} años</span><span>${pct(v, p.ln)}%</span></div>
      <div class="sp-track"><i style="width:${pct(v, p.ln)}%;background:${c}"></i></div>`).join("")}
    ${lead ? `<div class="sp-lead" style="--c:${lead.color}"><i></i>En la encuesta aquí va adelante: ${esc(lead.label)}</div>` : ""}`;
}

// Etiqueta con el valor de cada sección (porcentaje o electores), visible al acercarse.
const LABEL_ZOOM = 14;
const labels = L.layerGroup().addTo(map);
function paintLabels() {
  labels.clearLayers();
  const m = MODES[mode];
  if (!secLayer || !m || map.getZoom() < LABEL_ZOOM) return;
  const view = map.getBounds().pad(0.1);
  secLayer.eachLayer((l) => {
    const c = l.getBounds().getCenter();
    if (!view.contains(c)) return;
    L.tooltip({ permanent: true, direction: "center", className: "sec-lbl", interactive: false })
      .setLatLng(c).setContent(m.fmt(m.val(l.feature.properties))).addTo(labels);
  });
}
map.on("zoomend moveend", paintLabels);

function paintSections() {
  if (!secLayer) return;
  const m = MODES[mode];
  if (m) {
    RAMP = m.ramp;
    document.getElementById("scale-title").textContent = m.label;
    breaks = quantiles(secLayer.getLayers().map((l) => m.val(l.feature.properties)));
    document.getElementById("scale-min").textContent = m.fmt(breaks[0]);
    document.getElementById("scale-max").textContent = m.fmt(breaks[5]);
    document.getElementById("scale-bar").style.background = `linear-gradient(90deg, ${RAMP.join(",")})`;
  }
  document.getElementById("scale").classList.toggle("show", !!m);
  secLayer.setStyle(sectionStyle);
  // En las capas del INE los puntos se ven más tenues para que se lea el color de la sección.
  document.getElementById("map").classList.toggle("ine-mode", !!m);
  zonesLayer.eachLayer((l) => l.setStyle({ fillOpacity: m ? 0 : .2, opacity: m ? 0 : .45 }));
  document.getElementById("hint").textContent = m
    ? `Acércate para ver el porcentaje de cada sección · toca una sección para ver todos sus datos`
    : "Toca un candidato para ver solo sus puntos · toca una sección para ver sus datos";
  // Al elegir una capa del INE, si el mapa está lejos se acerca lo justo para que se lean los porcentajes.
  if (m && map.getZoom() < LABEL_ZOOM) map.flyTo(map.getCenter(), LABEL_ZOOM, { duration: .8 });
  paintLabels();
}

async function loadSections() {
  if (!CITY.data) return;
  try {
    const res = await fetch(CITY.data);
    if (!res.ok) return;
    const fc = await res.json();
    secLayer = L.geoJSON(fc, { renderer: secRenderer, pane: "secciones", style: sectionStyle,
      onEachFeature: (f, layer) => {
        layer.bindPopup(() => popupHtml(f), { className: "sec-pop", maxWidth: 260, autoPanPaddingTopLeft: [12, 170], autoPanPaddingBottomRight: [12, 210] });
        layer.on("mouseover", () => layer.setStyle({ weight: 2.2, color: "#fff" }));
        layer.on("mouseout", () => secLayer.resetStyle(layer));
      } }).addTo(map);
    document.getElementById("src").textContent = "Secciones y electores: INE (lista nominal al 5 nov 2026).";
  } catch { /* sin capa del INE */ }
}

document.querySelectorAll(".mode").forEach((b) => b.onclick = () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".mode").forEach((x) => x.classList.toggle("on", x === b));
  paintSections();
});
loadSections();

/* ---------- Arranque ---------- */
try {
  const survey = await pickSurvey();
  if (!survey) {
    legendEl.innerHTML = `<span class="muted">No hay una encuesta activa de ${esc(CITY.name)}.</span>`;
    endIntro();
  } else {
    document.getElementById("title").textContent = txt(survey.title) || "Seguimiento de votación";
    document.getElementById("city").textContent = txt(survey.city) || CITY.name;
    document.title = `${txt(survey.title)} · muestra.mx`;
    colors = colorsFor(survey);
    onSnapshot(doc(db, "resultados_encuestas", `${survey.id}__mapa`),
      (snap) => {
        celdas = snap.exists() ? snap.data().celdas : {};
        if (!introDone) { prev = JSON.parse(JSON.stringify(celdas || {})); endIntro(); }
        else draw(true);
      },
      () => { legendEl.innerHTML = `<span class="muted">No se pudo cargar el mapa.</span>`; endIntro(); });
  }
} catch (e) {
  legendEl.innerHTML = `<span class="muted">No se pudo conectar. Recarga la página.</span>`;
  endIntro();
}

/* ---------- Datos ---------- */
async function pickSurvey() {
  const wanted = new URLSearchParams(location.search).get("e");
  const snap = await getDocs(query(collection(db, "encuestas"), where("active", "==", true)));
  const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  return list.find((s) => s.id === (wanted || CITY.survey)) || null;
}

function colorsFor(survey) {
  // Lista de todos los candidatos (aunque aún no tengan puntos). Si dos comparten id, los votos van al primero.
  const out = {};
  (Array.isArray(survey.options) ? survey.options : []).forEach((o, i) => {
    if (!o || !String(o.label || "").trim()) return;
    const baseId = String(o.id ?? `opt-${i + 1}`);
    const id = out[baseId] ? `${baseId}#${i}` : baseId;
    const img = String(o.imageUrl || "").trim();
    out[id] = { label: String(o.label).trim(), color: partyColor(o.party) || PALETTE[i % PALETTE.length],
      img: !img ? "" : /^(https?:|data:)/.test(img) ? img : SITE + (img.startsWith("/") ? "" : "/") + img };
  });
  return out;
}
